<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Turtle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Baloo 2', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(44, 62, 80, 0.15);
      padding: 40px 32px 32px 32px;
      text-align: center;
      max-width: 350px;
      width: 100%;
    }
    .mascot {
      font-size: 4rem;
      margin-bottom: 8px;
      animation: bounce 1.5s infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
    h1 {
      margin-bottom: 8px;
      font-size: 2.2rem;
      color: #2e8b57;
      letter-spacing: 1px;
    }
    .subtitle {
      color: #4e5d6c;
      margin-bottom: 24px;
      font-size: 1.1rem;
    }
    .coins {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #2e8b57;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .click-btn {
      background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 18px 48px;
      font-size: 1.5rem;
      font-family: 'Baloo 2', Arial, sans-serif;
      cursor: pointer;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(44, 62, 80, 0.08);
      transition: background 0.2s, transform 0.1s;
    }
    .click-btn:active {
      background: linear-gradient(90deg, #38f9d7 0%, #43e97b 100%);
      transform: scale(0.97);
    }
    .upgrade {
      margin-top: 10px;
      background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-family: 'Baloo 2', Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.07);
      transition: background 0.2s, transform 0.1s;
    }
    .upgrade:active {
      background: linear-gradient(90deg, #ffd200 0%, #f7971e 100%);
      transform: scale(0.97);
    }
    .upgrade-info {
      margin-top: 12px;
      color: #4e5d6c;
      font-size: 1rem;
    }
    .card {
      margin-top: 18px;
      padding: 16px 12px;
      background: #fff3e0;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.07);
    }
    .card h2 {
      margin: 0 0 10px 0;
      color: #e65100;
      font-size: 1.1rem;
    }
    .card p {
      margin: 0;
      color: #6d4c41;
      font-size: 1rem;
    }
    .tap-img-btn {
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 24px;
      cursor: pointer;
      outline: none;
      display: inline-block;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(44, 62, 80, 0.12);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .tap-img-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
    }
    .tap-img-btn:hover .coin-img {
      filter: brightness(1.1) drop-shadow(0 0 8px #ffe082);
    }
    .coin-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.10);
      transition: filter 0.2s;
      background: #f5e9c6;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: #fff;
      box-shadow: 0 -2px 12px rgba(44,62,80,0.07);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-btn {
      background: none;
      border: none;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 0;
      cursor: pointer;
      color: #888;
      font-family: 'Baloo 2', Arial, sans-serif;
      font-size: 1rem;
      transition: color 0.2s;
      position: relative;
    }
    .nav-btn .nav-icon {
      font-size: 1.6rem;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn .nav-coin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(44,62,80,0.10);
      background: #f5e9c6;
    }
    .nav-btn .nav-label {
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .nav-btn.nav-active, .nav-btn:active {
      color: #2e8b57;
    }
    .nav-btn.nav-active .nav-icon, .nav-btn:active .nav-icon {
      filter: drop-shadow(0 0 4px #a8edea);
    }
    @media (max-width: 400px) {
      .container { padding: 24px 8px; }
      .click-btn, .upgrade { font-size: 1rem; padding: 12px 16px; }
      .bottom-nav { height: 56px; }
      .nav-btn .nav-icon { font-size: 1.2rem; }
      .nav-btn .nav-coin { width: 22px; height: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="section-tap">
      <div class="mascot">🐢</div>
      <h1>World Turtle</h1>
      <div class="subtitle">Tap the turtle to earn coins and upgrade your world!</div>
      <div class="coins" id="coins">Coins: 0</div>
      <button class="tap-img-btn" onclick="earnCoins()" aria-label="Tap to earn coins">
        <img src="world-turtle-coin.png" alt="World Turtle Coin" class="coin-img" />
      </button>
      <button class="upgrade" onclick="buyUpgrade()">Upgrade (+1 per tap) - Cost: <span id="upgrade-cost">10</span></button>
      <div class="upgrade-info">Current Power: <span id="power">1</span> coins/tap</div>
    </div>
    <div id="section-leaderboard" style="display:none;">
      <h2 style="color:#2e8b57;">Leaderboard (Local)</h2>
      <ol id="leaderboard" style="text-align:left; margin:0; padding-left:20px; color:#333; font-size:1rem;"></ol>
    </div>
    <div id="section-refer" style="display:none;">
      <h2 style="color:#e65100;">Refer and Earn</h2>
      <p>Invite your friends and earn bonus coins!</p>
      <div style="margin: 16px 0;">
        <input id="ref-link" type="text" readonly value="https://t.me/YourBot?start=ref_USERID" style="width: 80%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;" />
        <button onclick="copyRefLink()" style="margin-left: 8px; padding: 8px 16px; border-radius: 8px; border: none; background: #2e8b57; color: #fff; font-size: 1rem; cursor: pointer;">Copy</button>
      </div>
      <div id="copy-msg" style="color: #388e3c; font-size: 0.95rem; display: none;">Referral link copied!</div>
    </div>
    <div id="section-tasks" style="display:none;">
      <h2 style="color:#388e3c;">Tasks</h2>
      <p>Complete daily tasks for extra rewards! (Coming soon)</p>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-btn nav-active" id="nav-tap" aria-label="Tap">
      <span class="nav-icon"><img src="world-turtle-coin.png" alt="Tap" class="nav-coin" /></span>
      <span class="nav-label">Tap</span>
    </button>
    <button class="nav-btn" id="nav-leaderboard" aria-label="Leaderboard">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Leaderboard</span>
    </button>
    <button class="nav-btn" id="nav-refer" aria-label="Refer & Earn">
      <span class="nav-icon">🤝</span>
      <span class="nav-label">Refer</span>
    </button>
    <button class="nav-btn" id="nav-tasks" aria-label="Tasks">
      <span class="nav-icon">📝</span>
      <span class="nav-label">Tasks</span>
    </button>
  </nav>
  <script>
    // Telegram WebApp API init
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    // Game state
    let coins = parseInt(localStorage.getItem('coins') || '0');
    let power = parseInt(localStorage.getItem('power') || '1');
    let upgradeCost = parseInt(localStorage.getItem('upgradeCost') || '10');

    function updateUI() {
      document.getElementById('coins').textContent = `Coins: ${coins}`;
      document.getElementById('power').textContent = power;
      document.getElementById('upgrade-cost').textContent = upgradeCost;
    }

    // Local leaderboard logic
    function updateLeaderboard() {
      let scores = JSON.parse(localStorage.getItem('localLeaderboard') || '[]');
      // Add/update current user
      const username = 'You';
      const existing = scores.find(s => s.username === username);
      if (existing) {
        existing.score = coins;
      } else {
        scores.push({ username, score: coins });
      }
      // Sort and keep top 10
      scores.sort((a, b) => b.score - a.score);
      scores = scores.slice(0, 10);
      localStorage.setItem('localLeaderboard', JSON.stringify(scores));
      // Render
      const lb = document.getElementById('leaderboard');
      lb.innerHTML = '';
      scores.forEach((s, i) => {
        lb.innerHTML += `<li>${s.username}: ${s.score}</li>`;
      });
    }

    function earnCoins() {
      coins += power;
      localStorage.setItem('coins', coins);
      updateUI();
      updateLeaderboard();
    }

    function buyUpgrade() {
      if (coins >= upgradeCost) {
        coins -= upgradeCost;
        power += 1;
        upgradeCost = Math.floor(upgradeCost * 1.7);
        localStorage.setItem('coins', coins);
        localStorage.setItem('power', power);
        localStorage.setItem('upgradeCost', upgradeCost);
        updateUI();
        updateLeaderboard();
      } else {
        alert('Not enough coins!');
      }
    }

    function copyRefLink() {
      const refInput = document.getElementById('ref-link');
      refInput.select();
      refInput.setSelectionRange(0, 99999); // For mobile
      document.execCommand('copy');
      const msg = document.getElementById('copy-msg');
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 1500);
    }

    // Initial UI and leaderboard
    updateUI();
    updateLeaderboard();

    // Navigation logic
    const navSections = {
      'nav-tap': 'section-tap',
      'nav-leaderboard': 'section-leaderboard',
      'nav-refer': 'section-refer',
      'nav-tasks': 'section-tasks',
    };
    Object.keys(navSections).forEach(navId => {
      document.getElementById(navId).addEventListener('click', function() {
        // Hide all sections
        Object.values(navSections).forEach(secId => {
          document.getElementById(secId).style.display = 'none';
        });
        // Remove active from all nav buttons
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
        // Show selected section
        document.getElementById(navSections[navId]).style.display = '';
        // Highlight active nav
        this.classList.add('nav-active');
      });
    });
  </script>
</body>
</html>
